# Apply migrations separately with the owner account before starting this mode.
services:
  api:
    environment:
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set a dedicated restricted login URL}
      REQUIRE_DATABASE_ISOLATION: "1"
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
